<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haulist</title>
<meta name="theme-color" content="#0E0F13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haulist">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F13; --card:#181A21; --card2:#20232C; --line:#2A2E39; --text:#F2F3F5; --muted:#8B90A0;
  --accent:#FF6B3D; --accent2:#FFB23D; --good:#2ECC8F; --radius:18px;
}
.light{ --bg:#F5F6F8; --card:#FFFFFF; --card2:#EEF0F4; --line:#E1E4EA; --text:#14161B; --muted:#6B7080; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,sans-serif;background:#000;color:var(--text);display:flex;justify-content:center}
#app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:100px;transition:background .2s;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;font-size:24px;letter-spacing:-.5px}
.logo span,.grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;border:2px solid var(--bg)}
.av.sm{width:22px;height:22px;font-size:10px;border-width:1px}
.av.lg{width:46px;height:46px;font-size:18px}
.stack{display:flex}.stack .av{margin-left:-8px}.stack .av:first-child{margin-left:0}
main{padding:0 18px}
h2{font-size:21px;font-weight:800;margin:6px 0 12px;letter-spacing:-.3px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.tap{cursor:pointer;transition:transform .1s}.tap:active{transform:scale(.97)}
.grow{flex:1;min-width:0}
.title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.chip.drop{background:rgba(46,204,143,.15);color:var(--good)}
.chip.hot{background:rgba(255,107,61,.15);color:var(--accent)}
.price{font-weight:700;font-size:15px}
.old{text-decoration:line-through;color:var(--muted);font-size:12px;margin-left:4px;font-weight:500}
.thumb{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:26px;flex-shrink:0;background:var(--card2)}
.btn{border:none;font-family:inherit;font-weight:600;font-size:13px;padding:9px 14px;border-radius:12px;cursor:pointer;background:var(--card2);color:var(--text)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.btn.full{width:100%;padding:14px;font-size:15px;border-radius:14px}
.btn.ghost{background:transparent;color:var(--muted);padding:6px}
.back{display:inline-flex;gap:6px;color:var(--muted);font-size:14px;cursor:pointer;margin-bottom:8px}
input,select{width:100%;font-family:inherit;font-size:15px;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--text);outline:none}
input:focus{border-color:var(--accent)}
label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin:12px 0 6px}
.hint{font-size:12px;color:var(--accent2);margin-top:6px}
/* hero */
.hero{border-radius:24px;padding:20px;margin-bottom:16px;background:linear-gradient(135deg,#FF6B3D,#FF3D7F 55%,#8B5CF6);color:#fff;position:relative;overflow:hidden;cursor:pointer}
.hero::after{content:"🛒";position:absolute;right:-6px;bottom:-14px;font-size:96px;opacity:.22;transform:rotate(-12deg)}
.hero h3{font-size:24px;font-weight:900;letter-spacing:-.5px}
.hero .go{display:inline-block;margin-top:14px;background:#fff;color:#FF3D7F;font-weight:800;padding:11px 18px;border-radius:99px;font-size:14px}
.live{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(46,204,143,.12);color:var(--good);font-size:13px;font-weight:600;margin-bottom:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3;transform:scale(1.6)}}
/* category grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:16px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s}
.tile:active{transform:scale(.96)}
.tile .em{font-size:30px}
.tile .nm{font-weight:800;font-size:16px;color:#fff}
.tile .ct{font-size:12px;color:rgba(255,255,255,.75);font-weight:600}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.2);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .3s}
.tile.new{background:var(--card);border:2px dashed var(--line);align-items:center;justify-content:center;color:var(--muted);font-weight:700}
/* items */
.item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;cursor:pointer;transition:all .18s}
.done .check{background:var(--good);border-color:var(--good);transform:scale(1.08)}
.done .check::after{content:"✓";color:#fff;font-weight:900;font-size:15px}
.done .title{text-decoration:line-through;color:var(--muted)}
.done{opacity:.6}
.cat{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll .chip{cursor:pointer;padding:8px 13px;font-size:12px}
.scroll .chip.on{background:var(--text);color:var(--bg)}
/* shop mode */
.shophead{display:flex;align-items:center;gap:16px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.ring{width:78px;height:78px;flex-shrink:0;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:900}
.sitem{display:flex;align-items:center;gap:14px;padding:16px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.sitem .check{width:32px;height:32px}
.sitem.done{opacity:.45}
.sitem.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.04)}}
/* nav */
nav{position:fixed;bottom:0;width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 6px 14px;z-index:10}
nav button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:64px}
nav button.on{color:var(--accent)}
nav .ic{font-size:20px}
nav .plus{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:28px;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 24px rgba(255,107,61,.4)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;justify-content:center;align-items:flex-end}
.overlay.show{display:flex}
.sheet{width:100%;max-width:440px;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px 28px;max-height:90vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;margin-bottom:6px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:13px;padding:10px;border-radius:11px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--card2);cursor:pointer;border:2px solid transparent}
.pick span.on{border-color:var(--accent)}
.result{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.code{font-size:30px;font-weight:900;letter-spacing:4px;text-align:center;padding:14px;border-radius:16px;background:var(--card2);margin:10px 0}
.toast{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.banner{font-size:12px;color:var(--muted);text-align:center;padding:4px 18px 6px}
.bud{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.bud .bbar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:8px;position:relative}
.bud .bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;transition:width .4s}
.over{color:#FF4D6A!important}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Haul<span>ist</span></div>
    <div class="me" id="meBadge" onclick="go('family')"></div>
  </header>
  <div class="banner">Demo mode · saves on this device only</div>
  <main id="view"></main>
  <nav>
    <button data-tab="home"><span class="ic">🏠</span>Home</button>
    <button data-tab="shop"><span class="ic">🛒</span>Shop</button>
    <button data-tab="add"><span class="plus">+</span></button>
    <button data-tab="pantry"><span class="ic">🧺</span>Pantry</button>
    <button data-tab="family"><span class="ic">👨‍👩‍👧</span>Family</button>
  </nav>
</div>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 1. DATA (Stage 2 moves this into Supabase) ===================== */
const COLORS = ['#FF6B3D','#8B5CF6','#22B8CF','#2ECC8F','#F43F5E','#EAB308'];
const EMOJIS = ['🛒','🏠','🎁','🥕','🧴','🐶','🎒','🎄','🧸','🔧','💊','🍼'];
const TILE_BG = ['linear-gradient(135deg,#2ECC8F,#139A6B)','linear-gradient(135deg,#22B8CF,#1D6FD1)','linear-gradient(135deg,#8B5CF6,#5B2FD1)',
                 'linear-gradient(135deg,#FF6B3D,#E53E5C)','linear-gradient(135deg,#EAB308,#E07B12)','linear-gradient(135deg,#F43F5E,#B0247E)'];

let state = {
  familyName: 'Our Family',
  inviteCode: 'HAUL-7K2P',
  members: [
    {id:'t', name:'Terrence', color:'#FF6B3D', role:'Admin',  status:'Added 2 items today'},
    {id:'m', name:'Mom',      color:'#8B5CF6', role:'Member', status:'Shopping at Target · now', shopping:'Target'},
    {id:'j', name:'Jordan',   color:'#22B8CF', role:'Member', status:'Last active 1h ago'},
  ],
  categories: [
    {id:'c1', name:'Groceries', emoji:'🥕', bg:0, gift:false, items:[
      {id:'i1', name:'Milk', aisle:'Dairy & Eggs', store:'Publix', price:4.29, by:'m', done:false},
      {id:'i2', name:'Eggs', aisle:'Dairy & Eggs', store:'Publix', price:3.99, by:'m', done:false},
      {id:'i3', name:'Bananas', aisle:'Produce', store:'Publix', price:1.89, by:'t', done:false},
      {id:'i4', name:'Chicken breast', aisle:'Meat & Seafood', store:'Publix', price:9.49, by:'m', done:false},
      {id:'i5', name:'Rice', aisle:'Pantry', store:'Publix', price:3.49, by:'j', done:true},
    ]},
    {id:'c2', name:'Home Stuff', emoji:'🏠', bg:1, gift:false, items:[
      {id:'i6', name:'Paper towels', aisle:'Household', store:'Target', price:12.99, by:'j', done:false},
      {id:'i7', name:'Bath Towel Set (6 pc)', aisle:'Household', store:'Walmart', price:24.97, by:'m', done:false},
      {id:'i8', name:'LED Desk Lamp', aisle:'Other', store:'Amazon', price:32.99, oldPrice:39.99, by:'t', done:false, url:'https://amazon.com'},
    ]},
    {id:'c3', name:'Wants', emoji:'🛍️', bg:2, gift:false, items:[
      {id:'i9', name:'Sony WH-1000XM5 Headphones', aisle:'Electronics', store:'Amazon', price:279.99, oldPrice:399.99, by:'j', done:false, url:'https://www.amazon.com/'},
      {id:'i11', name:'Instant Pot Duo 6qt', aisle:'Kitchen', store:'Target', price:69.99, oldPrice:89.99, by:'m', done:false, url:'https://www.target.com/'},
    ]},
  ],
  history: {c1:['Bread','Coffee','Greek yogurt','Avocados'], c2:['Dish soap','Trash bags']},  // "buy again" chips
  dark: true,
  pantry: [], trips: [], layout: {},
  favStores: ['Publix','Target','Walmart','Costco','Aldi'],
  // ---- Budget sync (Paycheck Planner) ----
  budget: {
    url: '', key: '',              // filled in on Family → Budget sync
    month: 'November 2026 (demo)',
    map: {c1:'Groceries', c2:'Shopping', c3:'Other wants'},   // Haulist category → budget category
    cats: [                        // demo numbers until the real sheet is connected
      {name:'Groceries', group:'Needs', goal:400, spent:257.40},
      {name:'Personal care', group:'Needs', goal:60, spent:18},
      {name:'Shopping', group:'Wants', goal:150, spent:121.50},
      {name:'Other wants', group:'Wants', goal:100, spent:40},
      {name:'Entertainment', group:'Fun', goal:80, spent:35},
    ],
    queue: [],                     // trips waiting to sync (offline / blocked)
  },
};
let me = 't', tab = 'home', openCat = null, shopFilter = 'all';

/* ===================== 2. HELPERS ===================== */
const $ = s => document.querySelector(s);
const who = id => state.members.find(f => f.id === id) || {name:'?',color:'#666'};
const money = n => n == null || isNaN(n) ? 'Add price' : '$' + Number(n).toFixed(2);
const uid = () => Math.random().toString(36).slice(2, 9);
const cost = i => (i.price||0) * (i.qty||1);                          // price × quantity
const hidden = i => !!(i.due && i.due > Date.now());                  // repeat item waiting to come back
const hm = t => t ? new Date(t).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar = (id, size='') => { const f = who(id); return `<div class="av ${size}" style="background:${esc(f.color)}">${esc((f.name||'?')[0])}</div>`; };
const cat = id => state.categories.find(c => c.id === id);
function toast(msg){ const t=$('#toast'); t.onclick=null; t.style.pointerEvents='none'; t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),1900); }
function buzz(){ try{ navigator.vibrate && navigator.vibrate(15); }catch(e){} }

const AISLES = {
  'Produce':['apple','banana','lettuce','tomato','onion','avocado','potato','lemon','lime','berr','grape','carrot','pepper','spinach','fruit'],
  'Dairy & Eggs':['milk','cheese','yogurt','butter','egg','cream'],
  'Meat & Seafood':['chicken','beef','pork','turkey','fish','salmon','shrimp','steak','bacon','sausage'],
  'Bakery':['bread','bagel','tortilla','bun','muffin'],
  'Pantry':['rice','pasta','cereal','beans','sauce','oil','flour','sugar','coffee','tea','soup','spice'],
  'Frozen':['frozen','ice cream','pizza'],
  'Household':['paper','towel','detergent','soap','trash','tissue','foil','sponge','bleach'],
};
function aisleFor(name){
  const n = name.toLowerCase();
  for (const [a, words] of Object.entries(AISLES)) if (words.some(w => n.includes(w))) return a;
  return 'Other';
}
const STORES = {'amazon':'Amazon','target':'Target','walmart':'Walmart','bestbuy':'Best Buy','nike':'Nike','costco':'Costco','etsy':'Etsy','ebay':'eBay','homedepot':'Home Depot','publix':'Publix','apple':'Apple','ikea':'IKEA'};
function parseLink(raw){
  let u; try { u = new URL(raw.trim()); } catch { return null; }
  const host = u.hostname.replace(/^www\./,'').split('.');
  const key = host.length > 1 ? host[host.length-2] : host[0];
  const store = STORES[key] || key.charAt(0).toUpperCase() + key.slice(1);
  const seg = u.pathname.split('/').filter(s => /[a-z]/i.test(s) && /[-_]/.test(s)).sort((a,b)=>b.length-a.length)[0] || '';
  const name = decodeURIComponent(seg).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim();
  return { store, name, url: u.href };
}
const CATALOG = [
  {name:'Apple AirPods Pro (2nd Gen)', store:'Amazon', price:189.99, emoji:'🎧'},
  {name:'Apple AirPods Pro (2nd Gen)', store:'Target', price:199.99, emoji:'🎧'},
  {name:'Apple AirPods Pro (2nd Gen)', store:'Best Buy', price:189.99, emoji:'🎧'},
  {name:'Ninja Air Fryer 4qt', store:'Walmart', price:79.00, emoji:'🍟'},
  {name:'Ninja Air Fryer 4qt', store:'Amazon', price:84.99, emoji:'🍟'},
  {name:'Tide Pods 81ct', store:'Target', price:21.99, emoji:'🧺'},
  {name:'Tide Pods 81ct', store:'Walmart', price:19.97, emoji:'🧺'},
  {name:'Stanley Quencher 40oz', store:'Target', price:45.00, emoji:'🥤'},
  {name:'Keurig K-Mini Coffee Maker', store:'Amazon', price:79.99, emoji:'☕'},
];

/* ===================== 2b. BUDGET SYNC ===================== */
const B = () => state.budget;
const budCat = name => B().cats.find(c => c.name === name);
const budFor = cid => budCat(B().map[cid]);
const left = bc => bc && bc.goal != null ? bc.goal - bc.spent : null;

// Draws one budget meter. "extra" = money in the cart that isn't logged yet
function budMeter(bc, extra = 0){
  if (!bc) return '';
  const l = left(bc);
  if (l == null) return `<div class="bud"><div class="title">💰 ${esc(bc.name)}</div><div class="sub">Spent $${bc.spent.toFixed(2)} this month · no goal set</div></div>`;
  const after = l - extra, used = Math.min(1, (bc.spent + extra) / bc.goal);
  const color = after < 0 ? '#FF4D6A' : used > .8 ? '#EAB308' : '#2ECC8F';
  return `<div class="bud"><div class="row" style="justify-content:space-between">
      <div class="title">💰 ${esc(bc.name)}</div><b class="${l<0?'over':''}">$${l.toFixed(2)} left</b></div>
    <div class="bbar"><i style="width:${Math.min(1,bc.spent/bc.goal)*100}%;background:${color};opacity:.45"></i>
      <i style="width:${used*100}%;background:${color}"></i></div>
    <div class="sub" style="margin-top:6px">${extra ? `After this cart: <b class="${after<0?'over':''}">$${after.toFixed(2)}</b>${after<0?' — over budget!':''} · `:''}$${bc.spent.toFixed(0)} of $${bc.goal} · ${esc(B().month)}</div></div>`;
}

// Talks to HaulistSync.gs. Always POST + text/plain (avoids the browser's CORS "preflight" check)
async function callSheet(payload){
  if (!B().url) throw new Error('not connected');
  const r = await fetch(B().url, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({key:B().key, ...payload})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'sync failed');
  return j;
}
async function pullBudget(){
  try { const j = await callSheet({action:'getBudgets'}); B().cats = j.categories; B().month = j.month; render(); toast('Budget updated from Paycheck Planner'); }
  catch(e){ toast(B().url ? "Couldn't reach Paycheck Planner — check the URL and key" : 'Using in-app budget numbers'); }
}
async function flushQueue(){
  const q = B().queue; let sent = 0;
  for (const trip of [...q]) {
    try { await callSheet({action:'logTrip', trip}); q.splice(q.indexOf(trip),1); sent++; } catch(e){ break; }
  }
  return sent;
}

/* ===================== 3. SCREENS ===================== */
function go(t){ tab = t; openCat = null; render(); window.scrollTo(0,0); }
function render(){
  try { if (!db) localStorage.setItem('haulist_v2', JSON.stringify(state)); localStorage.setItem('haulist_dark', state.dark ? '1' : '0'); } catch(e) {}
  $('#app').classList.toggle('light', !state.dark);

/* ---------- Begin Shopping mode ---------- */
function shopView(){
  let items = shoppable();
  const stores = [...new Set(items.filter(i=>!i.done).map(i=>i.store).filter(Boolean))];
  if (shopFilter.startsWith('store:')) items = items.filter(i => i.store === shopFilter.slice(6));
  else if (shopFilter !== 'all') items = items.filter(i => i.cid === shopFilter);
  const here = hereStore(), order = state.layout[here] || [];
  const act = items.filter(i => i.status !== 'out');
  const done = act.filter(i=>i.done).length, total = act.length;
  const pct = total ? done/total : 0, C = 2*Math.PI*33;
  const cart = items.filter(i=>i.done).reduce((s,i)=>s+cost(i),0);
  const groups = {};
  items.forEach(i => (groups[i.reqBy && !i.done ? '🙋 Requests' : i.status==='out' ? '❌ Out of stock' : (i.aisle || i.cname)] ||= []).push(i));
  const rank = g => g === '🙋 Requests' ? -1 : g === '❌ Out of stock' ? 1e6 : (order.indexOf(g) < 0 ? 1e5 : order.indexOf(g));
  const keys = Object.keys(groups).sort((a,b) => rank(a)-rank(b) || a.localeCompare(b));
  const chip = (key,label) => `<span class="chip ${shopFilter===key?'on':''}" onclick="shopFilter='${key}';render()">${label}</span>`;
  return `<h2>${pct===1 && total ? '🎉 All done!' : 'Shopping'}</h2>
    <div class="shophead">
      <div class="ring"><svg width="78" height="78"><circle cx="39" cy="39" r="33" stroke="var(--card2)" stroke-width="8" fill="none"/>
        <circle cx="39" cy="39" r="33" stroke="url(#g)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" style="transition:stroke-dashoffset .4s"/>
        <defs><linearGradient id="g"><stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#FFB23D"/></linearGradient></defs></svg>
        <b>${Math.round(pct*100)}%</b></div>
      <div class="grow"><div class="title">${done} of ${total} in the cart</div>
        <div class="sub" style="margin:3px 0 8px">Cart so far: <b class="grad">$${cart.toFixed(2)}</b></div>
        <div class="row"><button class="btn primary" onclick="finishTrip()">Finish trip</button>
        <button class="btn" onclick="presenceSheet()">${who(me).shopping ? '📍 '+esc(who(me).shopping) : "📍 Check in"}</button></div></div>
    </div>
    ${who(me).shopping ? `<div class="live">✅ Checked in at <b>${esc(who(me).shopping)}</b> · ${hm(who(me).since)}${order.length ? ' · sorted like your last trip here' : ''}</div>` : ''}
    ${(() => {
      const byBud = {};
      items.filter(i=>i.done).forEach(i => { const b = B().map[i.cid]; if (b) byBud[b] = (byBud[b]||0) + cost(i); });
      const shown = [...new Set(items.map(i => B().map[i.cid]).filter(Boolean))];
      return shown.map(b => budMeter(budCat(b), byBud[b]||0)).join('');
    })()}
    <div class="scroll">${chip('all','All')}${state.categories.map(c=>chip(c.id, c.emoji+' '+esc(c.name))).join('')}
      ${stores.map(s=>chip('store:'+s,'📍 '+esc(s))).join('')}</div>
    ${keys.map(g => `<div class="cat">${esc(g)}</div>` +
      groups[g].sort((a,b)=>a.done-b.done).map(i => {
        const ex = extras(i);
        return `<div class="sitem ${i.done?'done':''} ${i.status==='out'?'done':''}" id="s_${i.id}" onclick="toggle('${i.cid}','${i.id}',true)">
        <div class="check"></div>
        <div class="grow"><div class="title">${i.qty>1?`<b class="grad">×${i.qty}</b> `:''}${esc(i.name)}</div>
          ${ex ? `<div class="sub">${ex}</div>` : ''}
          <div class="sub">${i.cemoji} ${esc(i.cname)}${i.store?' · '+esc(i.store):''}${i.reqBy?` · 🙋 ${esc(who(i.reqBy).name)}`:''}</div></div>
        <b style="font-size:14px">${i.price?'$'+cost(i).toFixed(2):''}</b>
        <button class="btn ghost" style="font-size:20px;padding:4px 8px" onclick="event.stopPropagation();shopItemSheet('${i.cid}','${i.id}')">⋯</button></div>`;
      }).join('')).join('')
      || '<p class="sub" style="margin-top:14px">Nothing to buy here. Nice.</p>'}
    <div style="height:10px"></div>
    <button class="btn full" onclick="sendInstacart()">🥕 Send what's left to Instacart</button>`;
}

let addMode = 'link', draft = null, newCat = {emoji:'🛒', bg:3, gift:false};
function sheet(html){ $('#sheet').innerHTML = `<div class="grab"></div>` + html; $('#overlay').classList.add('show'); }
function closeSheet(){ $('#overlay').classList.remove('show'); }
function catOptions(){ return state.categories.map(c=>`<option value="${c.id}" ${c.id===openCat?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join(''); }

function openAdd(prefill){
  addMode = 'link'; draft = null; drawAdd();
  if (typeof prefill === 'string' && prefill) { $('#link').value = prefill; previewLink(prefill); }
}
// One tap: read the link you just copied in the Target/Amazon app
async function pasteLink(){
  try { const t = await navigator.clipboard.readText(); $('#link').value = t; previewLink(t); }
  catch(e){ $('#link').focus(); toast('Long-press the box and tap Paste'); }
}
function drawAdd(){
  const body = addMode === 'link'
    ? `<label>Paste a product link from any store</label>
       <div class="row"><input id="link" placeholder="Paste a link" oninput="previewLink(this.value)">
         <button class="btn primary" onclick="pasteLink()">📋 Paste</button></div><div id="pv"></div>`
    : `<label>What are you looking for?</label><input id="q" placeholder="Search" oninput="searchCat(this.value)">
       <p class="sub" style="margin-top:8px">Opens the store's search. Find your item, tap Share → Copy link, then come back and paste it.</p><div id="res"></div>`;
  sheet(`<div class="seg">${['link','search'].map(m=>`<button class="${addMode===m?'on':''}" onclick="addMode='${m}';drawAdd()">${m==='link'?'🔗 Paste link':'🔍 Search stores'}</button>`).join('')}</div>
    ${body}<label>Add to category</label><select id="dest">${catOptions()}</select>
    <button class="btn full ghost" style="margin-top:10px" onclick="closeSheet()">Cancel</button>`);
}
function previewLink(v){
  const p = parseLink(v);
  if (!p) { $('#pv').innerHTML = v ? '<p class="sub" style="margin-top:8px">That doesn\'t look like a link yet…</p>' : ''; draft = null; return; }
  draft = p;
  const remembered = (state.storeCat||{})[p.store];            // last category you used for this store
  if (remembered && cat(remembered) && !openCat) $('#dest').value = remembered;
  $('#pv').innerHTML = `<div class="item" style="margin-top:12px"><div class="thumb">🛍️</div>
      <div class="grow"><span class="chip">${esc(p.store)}</span><div class="sub" style="margin-top:4px">Store and name filled in from the link</div></div></div>
    <label>Name</label><input id="dn" value="${esc(p.name)}" placeholder="Product name">
    <label>Price</label><input id="dp" type="number" step="0.01" placeholder="0.00">
    <div class="sub" style="margin-top:6px">Type the price from the store page.</div>
    <button class="btn full primary" style="margin-top:14px" onclick="addFromLink()">Add it</button>`;
  setTimeout(()=>$('#dp') && $('#dp').focus(), 50);
}
function addFromLink(){ addItem({name:$('#dn').value.trim()||'Untitled item', store:draft.store, price:parseFloat($('#dp').value)||null, url:draft.url}); }
function searchCat(q){
  q = q.trim();
  const STORE_SEARCH = {Target:'https://www.target.com/s?searchTerm=', Walmart:'https://www.walmart.com/search?q=',
    Amazon:'https://www.amazon.com/s?k=', Publix:'https://www.publix.com/search?searchTerm=', Costco:'https://www.costco.com/CatalogSearch?keyword='};
  $('#res').innerHTML = q ? `<div class="grid" style="margin-top:12px">${Object.entries(STORE_SEARCH).map(([n,u]) =>
    `<a class="btn" style="text-align:center;text-decoration:none;padding:14px" href="${u+encodeURIComponent(q)}" target="_blank" rel="noopener">🔍 ${n}</a>`).join('')}</div>` : '';
}
function addItem(p){
  const c = cat($('#dest').value);
  if (p.store) (state.storeCat ||= {})[p.store] = c.id;          // remember store → category
  c.items.unshift({id:uid(), name:p.name, store:p.store, price:p.price, emoji:p.emoji, url:p.url, aisle:aisleFor(p.name), by:me, done:false, at:Date.now()});
  putItem(c.id, c.items[0]); saveSettings();
  closeSheet(); tab='home'; openCat=c.id; render(); toast(`Added to ${c.name}`);
}

function newCategorySheet(){
  newCat = {emoji:'🛒', bg:3, gift:false};

function drawNewCat(){
  sheet(`<h2>New category</h2>
    <label>Name</label><input id="cn" placeholder="">
    <label>Icon</label><div class="pick">${EMOJIS.map(e=>`<span class="${newCat.emoji===e?'on':''}" onclick="newCat.emoji='${e}';keepName(drawNewCat)">${e}</span>`).join('')}</div>
    <label>Color</label><div class="pick">${TILE_BG.map((g,ix)=>`<span class="${newCat.bg===ix?'on':''}" style="background:${g}" onclick="newCat.bg=${ix};keepName(drawNewCat)"></span>`).join('')}</div>
    <label>Count it in which budget category?</label>
    <select id="cb"><option value="">— don't track —</option>${B().cats.map(b=>`<option ${b.name===newCat.bud?'selected':''}>${esc(b.name)}</option>`).join('')}</select>

    <label>If they're out…</label>
    <select id="er" onchange="$('#erc').style.display=this.value==='custom'?'block':'none'">
      <option value="" ${rsel===''?'selected':''}>Get something similar</option>

    <select id="ert">${[[0,'Just this once'],[7,'Every week'],[14,'Every 2 weeks'],[21,'Every 3 weeks'],[30,'Every month']]

function qtyStep(d){ edQty = Math.max(1, Math.min(99, edQty + d)); $('#eq').textContent = edQty; }
function saveItemSheet(cid, iid){
  const i = cat(cid).items.find(x=>x.id===iid);
  i.name = $('#en').value.trim() || i.name;
  i.price = parseFloat($('#ep').value) || null;
  i.qty = edQty; i.note = $('#eno').value.trim();
  const r = $('#er').value; i.repl = r === 'custom' ? $('#erc').value.trim() : r;
  i.repeat = +$('#ert').value || 0;
  i.status = $('#eo').classList.contains('on') ? 'out' : '';
  if (i.status === 'out') i.done = false;
  putItem(cid, i); closeSheet(); render(); toast('Saved');
}
function removeItem(cid,iid){ const c=cat(cid); c.items=c.items.filter(x=>x.id!==iid); delItem(iid); closeSheet(); render(); toast('Removed'); }
function shopItemSheet(cid, iid){
  const i = cat(cid).items.find(x=>x.id===iid);
  const custom = i.repl && i.repl !== 'none';
  sheet(`<h2>${i.qty>1?'×'+i.qty+' ':''}${esc(i.name)}</h2>
    ${extras(i) ? `<p class="sub">${extras(i)}</p>` : ''}

    <button class="btn full" style="margin-top:8px" onclick="shopMark('${cid}','${iid}','out')">❌ Out of stock${i.repl==='none'?'':' (skip for now)'}</button>
    <button class="btn full ghost" style="margin-top:8px" onclick="itemSheet('${cid}','${iid}')">✏️ Edit details</button>`);
}
function shopMark(cid, iid, how){
  const i = cat(cid).items.find(x=>x.id===iid);
  if (how === 'out') { i.status = 'out'; i.done = false; toast('Marked out of stock — stays for next trip'); }
  else { i.status = ''; i.done = true; if (how === 'repl') i.note = ((i.note||'') + ' (got: ' + i.repl + ')').trim(); noteAisle(i); }
  putItem(cid, i); closeSheet(); buzz(); render();
}
function bringBack(cid, iid){ const i = cat(cid).items.find(x=>x.id===iid); i.due = null; i.done = false; putItem(cid, i); render(); toast(`${i.name} is back on the list`); }

/* ---------- list clear with undo ---------- */
function clearList(cid, onlyChecked){
  const c = cat(cid);
  const gone = c.items.filter(i => !hidden(i) && (!onlyChecked || i.done));
  if (!gone.length) return toast(onlyChecked ? 'Nothing checked off yet' : 'List is already empty');
  c.items = c.items.filter(i => !gone.includes(i)); gone.forEach(i => delItem(i.id)); render();
  toastUndo(`Cleared ${gone.length} item${gone.length>1?'s':''}`, () => { gone.forEach(i => { c.items.push(i); putItem(cid, i); }); render(); toast('Restored'); });
}
function toastUndo(msg, undo){
  const t = $('#toast'); t.innerHTML = `${esc(msg)} · <u>Undo</u>`; t.classList.add('show'); t.style.pointerEvents = 'auto';
  t.onclick = () => { t.onclick = null; t.style.pointerEvents = 'none'; t.classList.remove('show'); undo(); };
  clearTimeout(t._h); t._h = setTimeout(() => { t.classList.remove('show'); t.style.pointerEvents = 'none'; t.onclick = null; }, 10000);
}

function addPantry(name, cid){
  name = (name||'').trim(); if (!name) return;
  if (state.pantry.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast(`${name} is already here`);
  const g = state.categories.find(c => /grocer/i.test(c.name)) || state.categories[0];
  const p = {id:uid(), name, cat: cid || (/paper|soap|detergent|toilet|tooth/i.test(name) ? (state.categories.find(c=>/home/i.test(c.name))||g)?.id : g?.id), low:false, at:Date.now()};
  state.pantry.push(p); putPantry(p); render();
}
function lowToggle(pid){
  const p = state.pantry.find(x=>x.id===pid); p.low = !p.low; putPantry(p);
  const c = cat(p.cat);
  if (p.low && c) {
    const ex = c.items.find(i => i.name.toLowerCase() === p.name.toLowerCase());
    if (ex) { if (hidden(ex) || ex.done) { ex.due = null; ex.done = false; putItem(c.id, ex); } }
    else { const i = {id:uid(), name:p.name, aisle:aisleFor(p.name), by:me, done:false, price:null, qty:1, at:Date.now()}; c.items.push(i); putItem(c.id, i); }
    toast(`${p.name} → ${c.name} list`);
  }
  render();
}
function delPantryItem(pid){ const p = state.pantry.find(x=>x.id===pid); state.pantry = state.pantry.filter(x=>x.id!==pid); delPantry(pid); render();
  toastUndo(`Removed ${p.name}`, () => { state.pantry.push(p); putPantry(p); render(); }); }

/* ---------- who paid / split ---------- */
function balances(){
  const bal = {};
  state.trips.forEach(t => {
    const s = (t.split||[]).filter(Boolean); if (!t.paidBy || !s.length) return;
    const share = (+t.total||0) / s.length;
    s.forEach(m => { if (m === t.paidBy) return; bal[m] = (bal[m]||0) - share; bal[t.paidBy] = (bal[t.paidBy]||0) + share; });
  });
  return bal;
}
function debts(){  // turn balances into "A owes B $X" lines
  const b = balances(), owe = [], get = [];
  for (const [id,v] of Object.entries(b)) { if (v < -0.005) owe.push([id,-v]); if (v > 0.005) get.push([id,v]); }
  const out = [];
  while (owe.length && get.length) {
    const amt = Math.min(owe[0][1], get[0][1]);
    out.push({from:owe[0][0], to:get[0][0], amt});
    owe[0][1] -= amt; get[0][1] -= amt;
    if (owe[0][1] < 0.005) owe.shift(); if (get[0][1] < 0.005) get.shift();
  }
  return out;
}
function moneyCard(){
  const d = debts();
  return `<div class="card"><div class="title">💸 Money between you</div>
    ${d.length ? d.map(x => `<div class="row" style="justify-content:space-between;padding:8px 0">
      <span>${esc(who(x.from).name)} owes ${esc(who(x.to).name)} <b>$${x.amt.toFixed(2)}</b></span>
      <button class="btn" onclick="settle('${x.from}','${x.to}',${x.amt.toFixed(2)})">Settle up</button></div>`).join('')
      : '<div class="sub">All even. Split a trip at Finish trip to track who owes who.</div>'}</div>`;
}
function settle(from, to, amt){
  saveTrip({id:uid()+Date.now().toString(36), lines:[], kind:'settle', paidBy:from, split:[to], total:amt});
  render(); toast(`Marked $${(+amt).toFixed(2)} as paid`);
}

/* ===================== 5. ACTIONS ===================== */
function toggle(cid, iid, inShop){
  const i = cat(cid).items.find(x=>x.id===iid);
  i.done = !i.done; if (i.done) i.status = ''; if (inShop && i.done) noteAisle({...i, cname:cat(cid).name});
  putItem(cid, i); buzz(); render();
  if (inShop && i.done) { const el = $('#s_'+iid); el && el.classList.add('pop'); }
  if (inShop) { const all = shoppable().filter(x => shopFilter==='all' || x.cid===shopFilter || 'store:'+x.store===shopFilter);
    if (all.length && all.every(x=>x.done)) { confetti(); toast('🎉 Everything\'s in the cart!'); } }
}
function claim(cid, iid){
  const i = cat(cid).items.find(x=>x.id===iid);
  if (i.claimedBy && i.claimedBy !== me) return toast(`${who(i.claimedBy).name} already has this one`);
  i.claimedBy = i.claimedBy ? null : me; render();
  toast(i.claimedBy ? "Claimed — the family sees you've got it" : 'Unclaimed');
}
function quickAdd(cid, name){
  name = (name||'').trim(); if (!name) return;
  if (/^https?:\/\//i.test(name)) { openCat = cid; return openAdd(name); }   // pasted a link → link flow
  const c = cat(cid);
  const ex = c.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if (ex && hidden(ex)) return bringBack(cid, ex.id);
  if (ex && !ex.done) return toast(`${name} is already on the list`);
  c.items.push({id:uid(), name, aisle:aisleFor(name), by:me, done:false, price:null, qty:1, at:Date.now()});
  putItem(cid, c.items[c.items.length-1]);
  render(); toast(`${name} → ${aisleFor(name)}`);
}
function finishTrip(){
  const bought = shoppable().filter(i=>i.done);
  if (!bought.length) return toast('Check some items off first');
  const lines = {};
  bought.forEach(i => {
    const b = B().map[i.cid] || '(not linked)';
    const L = lines[b] ||= {category:b, label: i.cname + ' trip', amount:0, count:0};
    L.amount += cost(i); L.count++;
  });
  pendingTrip = {id:uid()+Date.now().toString(36), date:new Date().toISOString().slice(0,10), shopper:who(me).name,
    lines:Object.values(lines), paidBy:me, split:[], store:hereStore(), count:bought.length,
    total:bought.reduce((s,i)=>s+cost(i),0), noPrice:bought.filter(i=>!i.price).length};
  drawFinish(); confetti();
}
function drawFinish(){
  const t = pendingTrip, pick = (id, on, fn) => `<span class="chip ${on?'on':''}" style="padding:8px 12px;cursor:pointer" onclick="${fn}('${id}')">${esc(who(id).name)}</span>`;
  sheet(`<div style="text-align:center;font-size:54px">🎉</div><h2 style="text-align:center">Trip complete!</h2>
    <div class="code grad" style="font-size:34px;letter-spacing:0">$${t.total.toFixed(2)}</div>
    <p class="sub" style="text-align:center">${t.count} items${t.store ? ' at ' + esc(t.store) : ''}</p>
    ${t.noPrice ? `<div class="hint" style="text-align:center">⚠️ ${t.noPrice} item(s) have no price — tap ⋯ → Edit to add them first.</div>` : ''}
    <div class="card" style="margin-top:12px">
      <div class="title">Who paid?</div><div class="scroll" style="margin:8px 0">${state.members.map(m=>pick(m.id, t.paidBy===m.id, 'setPayer')).join('')}</div>
      <div class="title" style="margin-top:6px">Split with <span class="sub">(optional)</span></div>
      <div class="scroll" style="margin-top:8px">${state.members.map(m=>pick(m.id, t.split.includes(m.id), 'toggleSplit')).join('')}</div>
      ${t.split.length ? `<div class="sub" style="margin-top:6px">${t.split.length} way${t.split.length>1?'s':''}: $${(t.total/t.split.length).toFixed(2)} each</div>` : ''}
    </div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><div class="title">Count it in the budget</div>
        <div class="switch ${logIt?'on':''}" onclick="logIt=!logIt;this.classList.toggle('on')"></div></div>
      ${t.lines.map(l=>`<div class="row" style="justify-content:space-between;padding:6px 0;font-size:14px">
        <span>${esc(l.label)} → <b>${esc(l.category)}</b></span><b>$${l.amount.toFixed(2)}</b></div>`).join('')}
    </div>
    <button class="btn full primary" style="margin-top:6px" onclick="clearTrip()">Done</button>`);
}
function setPayer(id){ pendingTrip.paidBy = id; drawFinish(); }
function toggleSplit(id){ const s = pendingTrip.split; s.includes(id) ? s.splice(s.indexOf(id),1) : s.push(id); drawFinish(); }
let pendingTrip = null, logIt = true;
async function clearTrip(){
  const t = pendingTrip; if (!t) return;
  if (logIt) {
    t.lines.forEach(l => { const bc = budCat(l.category); if (bc) bc.spent += l.amount; });
    B().queue.push(t);
    const sent = B().url ? await flushQueue() : 0;
    if (!B().url) B().queue = [];
    toast(sent ? `Logged to Paycheck Planner` : B().url ? 'Saved — will sync when online' : 'Budget updated for the family');
  }
  saveTrip({...t, kind:'trip', budget: logIt});
  saveSettings();
  pendingTrip = null; logIt = true;
  // learn the store layout from the order you checked things off
  if (t.store && tripOrder.length) {
    const old = state.layout[t.store] || [];
    state.layout[t.store] = tripOrder.concat(old.filter(a => !tripOrder.includes(a)));
  }
  tripOrder = [];
  const boughtNames = [];
  state.categories.forEach(c => {
    const got = c.items.filter(i => i.done && !hidden(i));
    if (got.length) { state.history[c.id] = [...new Set([...got.map(i=>i.name), ...(state.history[c.id]||[])])].slice(0,10); putCat(c); }
    got.forEach(i => {
      boughtNames.push(i.name.toLowerCase());
      if (i.repeat) { Object.assign(i, {done:false, status:'', reqBy:null, due: Date.now() + i.repeat*864e5}); putItem(c.id, i); }   // comes back later
      else delItem(i.id);
    });
    c.items = c.items.filter(i => !(i.done && !i.repeat));
    c.items.forEach(i => { if (i.status === 'out') { i.status = ''; putItem(c.id, i); } });   // try again next trip
  });
  state.pantry.forEach(p => { if (p.low && boughtNames.includes(p.name.toLowerCase())) { p.low = false; putPantry(p); } });   // restocked
  saveSettings();
  setPresence('');
  closeSheet(); shopFilter='all'; go('home'); toast('Trip saved');
}

function confetti(){
  const cols = ['#FF6B3D','#FFB23D','#2ECC8F','#22B8CF','#8B5CF6','#F43F5E'];
  for (let k=0;k<60;k++){
    const d = document.createElement('div'); d.className='confetti';
    d.style.left = Math.random()*100+'vw'; d.style.background = cols[k%cols.length];
    d.style.animationDuration = (1.6+Math.random()*1.6)+'s'; d.style.animationDelay = (Math.random()*.4)+'s';
    d.style.borderRadius = Math.random()>.5 ? '50%' : '2px';
    document.body.appendChild(d); setTimeout(()=>d.remove(), 3800);
  }
}

/* ===================== 5b. LIVE FAMILY SYNC (Supabase) ===================== */
let db = null, sb = null, fam = null, names = {}, sheetLocked = false;
const live = {cats:[], items:[], members:[], settings:null, trips:[], pantry:[]};
const clean = o => JSON.parse(JSON.stringify(o));
function chk(r){ if (r && r.error) toast('Sync error: ' + r.error.message); }

// ---- rows ↔ app objects ----
const toRow = (i, cid) => ({id:i.id, family_id:fam.id, cat:cid, name:i.name, aisle:i.aisle||null, store:i.store||null,
  price:i.price ?? null, old_price:i.oldPrice ?? null, url:i.url||null, by:i.by||null, done:!!i.done, at:i.at||Date.now(),
  qty:i.qty||1, note:i.note||null, repl:i.repl||null, status:i.status||'', req_by:i.reqBy||null, repeat_days:i.repeat||null, due:i.due||null});
const fromRow = r => ({id:r.id, cat:r.cat, name:r.name, aisle:r.aisle, store:r.store, price:r.price==null?null:+r.price,
  oldPrice:r.old_price==null?null:+r.old_price, url:r.url, by:r.by, done:r.done, at:+r.at,
  qty:r.qty||1, note:r.note||'', repl:r.repl||'', status:r.status||'', reqBy:r.req_by||null, repeat:r.repeat_days||0, due:r.due?+r.due:null});

// ---- writes (do nothing in demo mode) ----
function putItem(cid, i){ if (db) sb.from('items').upsert(toRow(i, cid)).then(chk); }
function delItem(iid){ if (db) sb.from('items').delete().eq('id', iid).then(chk); }
function putPantry(p){ if (db) sb.from('pantry').upsert({id:p.id, family_id:fam.id, name:p.name, cat:p.cat||null, low:!!p.low, at:p.at||Date.now()}).then(chk); }
function delPantry(pid){ if (db) sb.from('pantry').delete().eq('id', pid).then(chk); }
function putCat(c, order){
  if (!db) return;
  const prev = live.cats.find(x => x.id === c.id) || {};
  sb.from('categories').upsert({id:c.id, family_id:fam.id, name:c.name, emoji:c.emoji, bg:c.bg,
    ord: order ?? prev.order ?? 99, again: state.history[c.id] || []}).then(chk);
}
function saveSettings(){
  if (!db) return;
  sb.from('settings').upsert({family_id:fam.id, month:B().month, budgets:B().cats, map:B().map,
    store_cat:state.storeCat||{}, sheet_url:B().url||'', sheet_key:B().key||'',
    fav_stores:state.favStores, layout:state.layout}).then(chk);
}
function saveTrip(t){
  const row = {id:t.id, by:me, lines:t.lines||[], total:+(t.total ?? (t.lines||[]).reduce((s,l)=>s+l.amount,0)).toFixed(2),
    paid_by:t.paidBy||me, split:t.split||[], kind:t.kind||'trip', store:t.store||null, count:t.count||0, budget:t.budget!==false};
  state.trips.push({...row, paidBy:row.paid_by, at:Date.now()});
  if (db) sb.from('trips').insert({...row, family_id:fam.id}).then(chk);
}
function setPresence(store){
  const m = who(me); m.shopping = store; m.since = Date.now();
  if (db) sb.from('members').update({shopping:store, since:m.since}).eq('family_id', fam.id).eq('user_id', me).then(chk);
  render();
}


// ---- reads: rebuild the screens from the live data ----
function rebuild(){
  const cats = live.cats.slice().sort((a,b)=>(a.order??99)-(b.order??99));
  state.categories = cats.map(c => ({id:c.id, name:c.name, emoji:c.emoji, bg:c.bg||0, gift:false,
    items: live.items.filter(i => i.cat === c.id).sort((a,b)=>(a.at||0)-(b.at||0))}));
  state.history = Object.fromEntries(cats.map(c => [c.id, (c.again||[]).slice()]));
  const st = live.settings || {};
  if (st.budgets) B().cats = clean(st.budgets);
  if (st.month) B().month = st.month;
  if (st.map) B().map = {...st.map};
  if (st.url !== undefined) { B().url = st.url || ''; B().key = st.key || ''; }
  state.storeCat = {...(st.storeCat||{})};
  if (Array.isArray(st.favStores) && st.favStores.length) state.favStores = st.favStores.slice();
  state.layout = clean(st.layout || {});
  state.trips = live.trips.slice(); state.pantry = live.pantry.map(p => ({...p}));
  const fresh = m => m.shopping && Date.now() - (m.since||0) < 3*3600e3;      // presence expires after 3h
  state.members = live.members.map(m => ({...m, shopping: fresh(m) ? m.shopping : '',
    status: fresh(m) ? `Shopping at ${m.shopping} · now` : ''}));
  if (openCat && !cat(openCat)) openCat = null;
  render();
}
async function loadTable(t){
  const {data, error} = await sb.from(t).select('*').eq('family_id', fam.id);
  if (error) return toast('Sync error: ' + error.message);
  if (t === 'categories') live.cats = data.map(c => ({...c, order:c.ord}));
  if (t === 'items') live.items = data.map(fromRow);
  if (t === 'members') { live.members = data.map(m => ({...m, id:m.user_id})); names = Object.fromEntries(data.map(m => [m.user_id, m.name])); }
  if (t === 'settings') { const x = data[0]; live.settings = x ? {budgets:x.budgets, month:x.month, map:x.map, storeCat:x.store_cat, url:x.sheet_url, key:x.sheet_key, favStores:x.fav_stores, layout:x.layout} : null; }
  if (t === 'trips') live.trips = data.map(x => ({...x, paidBy:x.paid_by, total:+x.total, at:Date.parse(x.created_at)}));
  if (t === 'pantry') live.pantry = data;
  rebuild();
}

// ---- sign in / family setup ----
async function boot(){
  const cfg = window.HAULIST_CONFIG || {};
  if (!window.supabase || !cfg.SUPABASE_URL || /PASTE/.test(cfg.SUPABASE_URL)) return handleShare();   // no keys → demo mode
  const jc = new URLSearchParams(location.search).get('join');
  if (jc) { pendingJoin = jc.toUpperCase(); try { localStorage.setItem('haulist_join', pendingJoin); } catch(e) {} history.replaceState(null, '', location.pathname); }
  else { try { pendingJoin = localStorage.getItem('haulist_join') || ''; } catch(e) {} }
  if (pendingJoin) authMode = 'up';
  state.categories = []; state.members = []; state.history = {}; openCat = null;   // hosted app: no sample data
  $('.banner').textContent = 'Sign in to see your family list'; render();
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') setTimeout(() => newPwScreen(), 300); });
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return authScreen();
  me = session.user.id;
  const {data:mems, error} = await sb.from('members').select('family_id').eq('user_id', me);
  if (error) return toast('Sync error: ' + error.message);
  const md = session.user.user_metadata || {};
  const myName = (md.name || md.full_name || '').split(' ')[0];      // Google gives a full name; keep the first
  if (pendingJoin) return autoJoin(myName);                                 // came from an invite link
  if (!mems.length) return familySetup(myName);
  let last = ''; try { last = localStorage.getItem('haulist_family') || ''; } catch(e) {}
  await enterFamily((mems.find(m => m.family_id === last) || mems[0]).family_id);
}
function lockSheet(html){ sheetLocked = true; sheet(html); }
function unlockSheet(){ sheetLocked = false; closeSheet(); }
let authMode = 'in';
function authScreen(msg){
  const up = authMode === 'up';
  lockSheet(`<div class="logo" style="text-align:center;font-size:34px;margin:6px 0 4px">Haul<span>ist</span></div>
    <p class="sub" style="text-align:center;margin-bottom:10px">Your family's shared shopping list</p>
    <div class="seg"><button class="${up?'':'on'}" onclick="authMode='in';authScreen()">Sign in</button>
      <button class="${up?'on':''}" onclick="authMode='up';authScreen()">Create account</button></div>
    ${pendingJoin && !msg ? `<div class="live" style="margin-top:8px">🎉 You've been invited to a family. Create an account (or sign in) to join.</div>` : ''}
    ${msg ? `<div class="hint" style="text-align:center;margin:8px 0">${esc(msg)}</div>` : ''}
    <button type="button" class="btn full" style="margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f" onclick="googleSignIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
      Continue with Google</button>
    <div class="cat" style="text-align:center;margin:12px 0 0">or use email</div>
    <form id="authForm" onsubmit="event.preventDefault();${up?'signUp()':'signIn()'}">
    ${up ? `<label>First name</label><input id="an" name="name" autocomplete="given-name">` : ''}
    <label>Email</label><input id="ae" name="email" type="email" autocomplete="username" value="${esc(lastEmail)}">
    <label>Password${up ? ' (at least 6 characters)' : ''}</label>
    <div class="row"><input id="ap" name="password" type="password" autocomplete="${up?'new-password':'current-password'}">
      <button type="button" class="btn" onclick="const p=$('#ap');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'Show':'Hide'">Show</button></div>
    <button type="submit" class="btn full primary" style="margin-top:16px">${up?'Create account':'Sign in'}</button></form>
    ${up ? '' : `<button class="btn full ghost" style="margin-top:6px" onclick="forgotPw()">Forgot password?</button>`}
    <p class="sub" style="text-align:center;margin-top:10px"><a href="privacy.html" style="color:var(--muted)">Privacy Policy</a></p>`);
}
let lastEmail = '';
const remember = () => { lastEmail = ($('#ae')||{}).value || lastEmail; };
async function signIn(){
  remember();
  const {error} = await sb.auth.signInWithPassword({email:lastEmail.trim(), password:$('#ap').value});
  if (error) return authScreen(error.message === 'Invalid login credentials' ? 'Wrong email or password' : error.message);
  unlockSheet(); boot();
}
async function signUp(){
  const name = $('#an').value.trim(); remember();
  if (!name) return authScreen('Type your first name');
  const {data, error} = await sb.auth.signUp({email:lastEmail.trim(), password:$('#ap').value, options:{data:{name}}});
  if (error) return authScreen(error.message);
  if (!data.session) { authMode = 'in'; return authScreen('Check your email to confirm, then sign in.'); }
  unlockSheet(); boot();
}
async function googleSignIn(){
  const {error} = await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: location.href.split(/[?#]/)[0]}});
  if (error) authScreen(error.message.includes('not enabled') ? 'Google sign-in isn\'t turned on yet — use email for now' : error.message);
}
async function forgotPw(){
  remember(); if (!lastEmail) return authScreen('Type your email first');
  const {error} = await sb.auth.resetPasswordForEmail(lastEmail.trim(), {redirectTo: location.href.split(/[?#]/)[0]});
  authScreen(error ? error.message : 'Check your email for a reset link');
}
function newPwScreen(msg){
  lockSheet(`<h2>Set a new password</h2>${msg?`<div class="hint">${esc(msg)}</div>`:''}
    <label>New password (at least 6 characters)</label><input id="np" type="password" autocomplete="new-password">
    <button class="btn full primary" style="margin-top:14px" onclick="savePw()">Save password</button>`);
}
async function savePw(){
  const {error} = await sb.auth.updateUser({password:$('#np').value});
  if (error) return newPwScreen(error.message);
  unlockSheet(); toast('Password updated'); boot();
}
function welcome(){
  try { if (localStorage.getItem('haulist_welcomed')) return; localStorage.setItem('haulist_welcomed','1'); } catch(e) { return; }
  sheet(`<h2>Welcome to Haulist 👋</h2>
    <div class="item"><div class="thumb">➕</div><div class="grow"><div class="title">Add things</div><div class="sub">Type them in a category, or paste a link from any store app.</div></div></div>
    <div class="item"><div class="thumb">🛒</div><div class="grow"><div class="title">Begin Shopping</div><div class="sub">Everything on one page. Tap to check off.</div></div></div>
    <div class="item"><div class="thumb">👨‍👩‍👧</div><div class="grow"><div class="title">Invite family</div><div class="sub">Family tab → Copy invite. Lists update live for everyone.</div></div></div>
    <button class="btn full primary" style="margin-top:10px" onclick="closeSheet()">Got it</button>`);
}
let pendingJoin = '', setupName = '', pickColor = '';
function profileSheet(){
  const m = who(me); pickColor = m.color || COLORS[0];
  sheet(`<h2>Your profile</h2>
    <div style="display:flex;justify-content:center;margin:4px 0 6px" id="pav">${avatar(me,'lg')}</div>
    <label>Name (what your family sees)</label><input id="pn" value="${esc(m.name||'')}" maxlength="30">
    <label>Color</label><div class="pick" id="pc">${COLORS.map(c => `<span class="${pickColor===c?'on':''}" style="background:${c}"
      onclick="pickColor='${c}';document.querySelectorAll('#pc span').forEach(x=>x.classList.remove('on'));this.classList.add('on')"></span>`).join('')}</div>
    <button class="btn full primary" style="margin-top:16px" onclick="saveProfile()">Save</button>
    ${db ? `<button class="btn full ghost" style="margin-top:6px" onclick="leaveSheet()">Leave this family</button>` : ''}`);
}
async function saveProfile(){
  const name = $('#pn').value.trim(); if (!name) return toast('Type a name');
  const m = who(me); m.name = name; m.color = pickColor;
  if (db) {
    const r = await sb.from('members').update({name, color:pickColor}).eq('family_id', fam.id).eq('user_id', me);
    if (r.error) return toast('Sync error: ' + r.error.message);
    sb.auth.updateUser({data:{name}});                       // new families you join use it too
    names[me] = name; loadTable('members');
  }
  closeSheet(); render(); toast('Profile saved');
}
function leaveSheet(){
  const others = state.members.filter(m => m.id !== me);
  if (who(me).role === 'Admin' && others.length) return toast("You're the Admin. Others still need you, so you can't leave yet.");
  sheet(`<h2>Leave ${esc(state.familyName)}?</h2><p class="sub">You'll stop seeing this family's lists. You can rejoin with an invite code.</p>
    <button class="btn full primary" style="margin-top:14px;background:#FF4D6A" onclick="leaveFamily()">Leave family</button>
    <button class="btn full ghost" style="margin-top:6px" onclick="closeSheet()">Cancel</button>`);
}
async function leaveFamily(){
  const r = await sb.from('members').delete().eq('family_id', fam.id).eq('user_id', me);
  if (r.error) return toast('Sync error: ' + r.error.message);
  try { localStorage.removeItem('haulist_family'); } catch(e) {}
  location.reload();
}
function familySetup(name, step, msg){
  setupName = name ?? setupName;
  const err = msg ? `<div class="hint" style="margin:8px 0">${esc(msg)}</div>` : '';
  if (step === 'join') return lockSheet(`<div class="back" onclick="familySetup(null)">‹ Back</div><h2>Join a family</h2>
    <p class="sub">Ask a family member for their code (Family tab → Copy invite).</p>${err}
    <label>Invite code</label><input id="fc" placeholder="HAUL-XXXX" style="text-transform:uppercase;font-size:20px;letter-spacing:2px;text-align:center">
    <button class="btn full primary" style="margin-top:14px" onclick="doJoin()">Join</button>`);
  if (step === 'new') return lockSheet(`<div class="back" onclick="familySetup(null)">‹ Back</div><h2>Start a new list</h2>
    <p class="sub">Name it whatever you like. You can invite people right after.</p>${err}
    <label>List name</label><input id="ff" value="${esc(setupName ? setupName + "'s Family" : '')}">
    <button class="btn full primary" style="margin-top:14px" onclick="doCreate()">Create</button>`);
  lockSheet(`<h2>Hi${setupName ? ' ' + esc(setupName) : ''}! 👋</h2><p class="sub" style="margin-bottom:14px">How do you want to start?</p>${err}
    <label>Your name (what your family sees)</label><input id="sn" value="${esc(setupName)}" maxlength="30" oninput="setupName=this.value.trim()">
    <div style="height:12px"></div>
    <div class="card row tap" onclick="familySetup(null,'new')"><div class="thumb">✨</div>
      <div class="grow"><div class="title">Start a new list</div><div class="sub">For you and your family. You'll get an invite code to share.</div></div></div>
    <div class="card row tap" onclick="familySetup(null,'join')"><div class="thumb">🔑</div>
      <div class="grow"><div class="title">Join a family</div><div class="sub">Someone already invited you? Enter their code.</div></div></div>
    <button class="btn full ghost" onclick="signOut()">Sign out</button>`);
}
async function autoJoin(name){
  const code = pendingJoin; pendingJoin = ''; try { localStorage.removeItem('haulist_join'); } catch(e) {}
  const {data, error} = await sb.rpc('join_family', {code, my_name:name});
  if (error) return familySetup(name, 'join', error.message + ' — check the code and try again.');
  unlockSheet(); await enterFamily(data); toast("🎉 You're in! Lists sync live now.");
}
async function doJoin(){
  const {data, error} = await sb.rpc('join_family', {code:$('#fc').value, my_name:setupName});
  if (error) return familySetup(null, 'join', error.message);
  unlockSheet(); await enterFamily(data); toast("🎉 You're in! Lists sync live now.");
}
async function doCreate(){
  const {data, error} = await sb.rpc('create_family', {fname:$('#ff').value.trim(), my_name:setupName});
  if (error) return familySetup(null, 'new', error.message);
  unlockSheet(); await enterFamily(data); inviteStep();
}
function inviteStep(){
  try { localStorage.setItem('haulist_welcomed','1'); } catch(e) {}      // this replaces the welcome card
  sheet(`<div style="text-align:center;font-size:48px">🎉</div><h2 style="text-align:center">Your list is ready!</h2>
    <p class="sub" style="text-align:center">Invite your family so everyone sees the same list, live.</p>
    <div class="code grad">${esc(state.inviteCode)}</div>
    <button class="btn full primary" onclick="copyCode()">📋 Copy invite link</button>
    <button class="btn full ghost" style="margin-top:6px" onclick="closeSheet()">I'll do it later</button>`);
}
async function enterFamily(fid){
  const {data:f, error} = await sb.from('families').select('*').eq('id', fid).single();
  if (error) return toast('Sync error: ' + error.message);
  fam = f; db = sb; state.familyName = f.name; state.inviteCode = f.invite_code;
  try { localStorage.setItem('haulist_family', f.id); } catch(e) {}
  state.categories = []; state.members = []; state.history = {}; openCat = null;
  $('.banner').textContent = '🟢 Live · syncing with ' + f.name;
  await Promise.all(['categories','items','members','settings','trips','pantry'].map(loadTable));
  // live updates: on any change, re-read that table (small family data = fast)
  const timers = {}, refetch = t => { clearTimeout(timers[t]); timers[t] = setTimeout(() => loadTable(t), 250); };
  const ch = sb.channel('haulist-' + f.id);
  ['categories','items','members','settings','trips','pantry'].forEach(t => ch.on('postgres_changes', {event:'*', schema:'public', table:t}, p => {
    if (t === 'items' && p.eventType === 'INSERT' && p.new.family_id === f.id && p.new.by !== me) {
      if (p.new.req_by && who(me).shopping) { toast(`🙋 ${names[p.new.req_by] || 'Someone'} asked you to grab ${p.new.name}`); buzz(); }
      else toast(`${names[p.new.by] || 'Someone'} added ${p.new.name}`);        // "Mom added Milk"
    }
    refetch(t);
  }));
  ch.subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) ['items','members'].forEach(refetch); });  // phone woke up
  if (B().url) pullBudget();
  welcome();
  handleShare();
}
async function newCode(){
  if (!db) { state.inviteCode = 'HAUL-' + Math.random().toString(36).slice(2,6).toUpperCase(); render(); return toast('New code made'); }
  const {data, error} = await sb.rpc('new_invite_code', {fid: fam.id});
  if (error) return toast(error.message);
  state.inviteCode = data; render(); toast('New code made — old one stops working');
}
async function signOut(){ await sb.auth.signOut(); location.reload(); }

// ---- Android Share menu: Target app → Share → Haulist ----
function handleShare(){
  const q = new URLSearchParams(location.search);
  const text = [q.get('url'), q.get('text'), q.get('title')].filter(Boolean).join(' ');
  const link = (text.match(/https?:\/\/\S+/) || [])[0];
  if (!link) return;
  history.replaceState(null, '', location.pathname);
  openAdd(link);
}

// ---- offline-ready app shell ----
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===================== 6. WIRING ===================== */
try { const saved = JSON.parse(localStorage.getItem('haulist_v2')); if (saved && saved.budget) state = saved; } catch(e) {}
try { const dk = localStorage.getItem('haulist_dark'); if (dk !== null) state.dark = dk === '1'; } catch(e) {}
boot();
function resetDemo(){ try { localStorage.removeItem('haulist_v2'); } catch(e) {} location.reload(); }
document.querySelectorAll('nav button').forEach(b => b.onclick = () => b.dataset.tab === 'add' ? openAdd() : go(b.dataset.tab));
$('#overlay').onclick = e => { if (e.target.id === 'overlay' && !sheetLocked) closeSheet(); };
render();
</script>
